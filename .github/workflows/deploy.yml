name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync repository files to Server via rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT || 22 }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.SERVER_APP_DIR || '~/apps/usdt_usd_arbitrage_telegram_bot/' }}
          EXCLUDES: '/node_modules/, /.git/, /data/, /.env, /user_config.json, /arbitrage_data.json'

      - name: Rebuild & Restart Docker Containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.SERVER_APP_DIR || '~/apps/usdt_usd_arbitrage_telegram_bot' }}"
            eval APP_DIR="$APP_DIR"

            echo "📦 Entering $APP_DIR..."
            cd "$APP_DIR"

            echo "🐳 Rebuilding and restarting containers..."
            docker compose up -d --build

            echo "🧹 Cleaning up dangling Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
