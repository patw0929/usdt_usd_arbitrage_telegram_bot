name: CI

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile || yarn install

    - name: Run verification test suite
      run: |
        node -e "
          const { calculateArbitrageOpportunity } = require('./src/calculator');
          const testResult = calculateArbitrageOpportunity(32.0, 32.1, 1.0014, {
            baseAmount: 490000,
            maxTradeFeeRate: 0.045,
            minProfitTWD: 1500,
            ubotDiscount: 0.035,
            withdrawFee: 30
          });
          if (typeof testResult.config.profitTWD !== 'number') {
            throw new Error('Calculator test failed');
          }
          console.log('✅ CI Smoke test passed! Profit:', testResult.config.profitTWD);
        "
